<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Weather Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="weather-app">
        <div class="search-box">
            <input type="text" placeholder="Enter city..." id="cityInput">
            <button id="searchBtn">Search</button>
        </div>

        <div class="main-weather">
            <div class="current-temp">
                <div class="temp-value">24°C</div>
                <div class="temp-city">London, UK</div>
                <div class="temp-desc">Partly Cloudy</div>
            </div>
            <div class="weather-visual">
                <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="Weather Icon">
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-card">
                <span>Humidity</span>
                <strong>64%</strong>
            </div>
            <div class="detail-card">
                <span>Wind Speed</span>
                <strong>12 km/h</strong>
            </div>
            <div class="detail-card">
                <span>Pressure</span>
                <strong>1012 hPa</strong>
            </div>
            <div class="detail-card">
                <span>Visibility</span>
                <strong>10 km</strong>
            </div>
        </div>
    </div>
</body>
</html>
