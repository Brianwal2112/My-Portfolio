<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | High-End Minimalist Commerce</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav" id="mainNav">
        <a href="index.html" class="logo">LUXE<span>.</span></a>
        <div class="search-container">
            <input type="text" id="productSearch" placeholder="Search collection...">
        </div>
        <ul class="nav-links">
            <li><a href="#shop">Collections</a></li>
            <li><a href="#about">Philosophy</a></li>
        </ul>
        <div class="cart-trigger" id="cartBtn">
            <span>BAG</span>
            <span class="cart-count">0</span>
        </div>
    </nav>

    <section class="hero">
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80" class="hero-img" alt="Luxury Store">
        <div class="hero-content">
            <h1>The Art of <br>Essentialism.</h1>
            <a href="#shop" class="btn-luxury">Explore Collection</a>
        </div>
    </section>

    <section id="shop" class="section">
        <div class="section-title">
            <span class="label">Curated Selection</span>
            <h2>Seasonal Essentials</h2>
        </div>
        
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="apparel">Apparel</button>
            <button class="filter-btn" data-category="accessories">Accessories</button>
            <button class="filter-btn" data-category="jewelry">Jewelry</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products injected by JS -->
        </div>
    </section>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span id="closeModal" class="close-modal">&times;</span>
            <div class="modal-grid">
                <div class="modal-visual">
                    <img src="" id="modalImage" alt="Product">
                </div>
                <div class="modal-info">
                    <span class="label" id="modalCategory">Category</span>
                    <h2 id="modalName">Product Name</h2>
                    <p id="modalPrice" class="product-price">$0.00</p>
                    <p id="modalDesc" class="description">Detailed description of the product's materials and craftsmanship.</p>
                    <button id="modalAddBtn" class="btn-luxury" style="width:100%; border:none; cursor:pointer; margin-top:2rem;">Add to Bag</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3 class="serif">Your Bag</h3>
            <span id="closeCart" style="cursor:pointer">CLOSE</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
