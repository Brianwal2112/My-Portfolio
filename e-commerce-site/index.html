<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Minimalist Boutique</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LUXE</div>
        <ul class="nav-links">
            <li><a href="#">Shop</a></li>
            <li><a href="#">Collections</a></li>
            <li><a href="#">About</a></li>
        </ul>
        <div class="cart-icon">Cart (0)</div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Essence of <br>Simplicity</h1>
            <p>Curated essentials for the modern individual.</p>
            <a href="#shop" class="cta">Shop Collection</a>
        </div>
        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6b//auto=format&fit=crop&w=1000&q=80" alt="Luxury Product">
        </div>
    </header>

    <section id="shop" class="products">
        <div class="container">
            <h2 class="section-title">Featured Pieces</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e56471e238a?auto=format&fit=crop&w=500&q=80" alt="Product 1">
                    <h3>Minimalist Watch</h3>
                    <p>$199.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6b?auto=format&fit=crop&w=500&q=80" alt="Product 2">
                    <h3>Leather Tote</h3>
                    <p>$250.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1584917865442-8a72f077754d?auto=format&fit=crop&w=500&q=80" alt="Product 3">
                    <h3>Studio Lamp</h3>
                    <p>$89.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80" alt="Product 4">
                    <h3>Analog Camera</h3>
                    <p>$450.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 LUXE Boutique. All rights reserved.</p>
    </footer>
</body>
</html>
