<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | LUXE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 4rem;
            padding: 120px 5% 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .form-section {
            margin-bottom: 3rem;
        }
        .form-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .input-field label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #666;
        }
        .input-field input {
            padding: 0.8rem;
            border: 1px solid #eee;
            font-family: inherit;
        }
        .order-summary {
            background: #fafafa;
            padding: 2rem;
            border: 1px solid #eee;
            position: sticky;
            top: 120px;
            height: fit-content;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .summary-total {
            border-top: 1px solid #eee;
            padding-top: 1rem;
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
        }
        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; }
            .input-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">LUXE<span>.</span></a>
        <a href="index.html" class="btn-text" style="text-decoration:none; color:#000; font-size:0.8rem">BACK TO SHOP</a>
    </nav>

    <div class="checkout-container">
        <div class="checkout-form">
            <div class="form-section">
                <h3>Shipping Information</h3>
                <div class="input-group">
                    <div class="input-field">
                        <label>First Name</label>
                        <input type="text" required>
                    </div>
                    <div class="input-field">
                        <label>Last Name</label>
                        <input type="text" required>
                    </div>
                </div>
                <div class="input-field">
                    <label>Address</label>
                    <input type="text" required>
                </div>
                <div class="input-group">
                    <div class="input-field">
                        <label>City</label>
                        <input type="text" required>
                    </div>
                    <div class="input-field">
                        <label>Postal Code</label>
                        <input type="text" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Payment Detail</h3>
                <div class="input-field">
                    <label>Card Number</label>
                    <input type="text" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="input-group">
                    <div class="input-field">
                        <label>Expiry Date</label>
                        <input type="text" placeholder="MM/YY" required>
                    </div>
                    <div class="input-field">
                        <label>CVC</label>
                        <input type="text" placeholder="123" required>
                    </div>
                </div>
            </div>

            <button class="btn-luxury" style="width:100%; border:none; cursor:pointer; background:#000; color:#fff;">Complete Purchase</button>
        </div>

        <div class="order-summary">
            <h3 class="serif" style="margin-bottom:2rem">Order Summary</h3>
            <div id="summaryItems"></div>
            <div class="summary-total">
                <span>Total</span>
                <span id="summaryTotal">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('luxe-cart')) || [];
        const summaryContainer = document.getElementById('summaryItems');
        const totalEl = document.getElementById('summaryTotal');

        if(cart.length === 0) {
            summaryContainer.innerHTML = '<p>Your bag is empty.</p>';
        } else {
            summaryContainer.innerHTML = cart.map(item => `
                <div class="summary-item">
                    <span>${item.name}</span>
                    <span>$${item.price}</span>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.textContent = `$${total.toLocaleString()}`;
        }
    </script>
</body>
</html>
