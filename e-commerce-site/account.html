<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | LUMINA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+LDisplay:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav"><a href="index.html" class="logo">LUMINA<span>.</span></a> <a href="index.html" style="text-decoration:none; color:#000; font-size:0.7rem">BACK TO HOME</a></nav>
    <section class="section" style="max-width:800px; margin:0 auto; padding-top:150px;">
        <h2 class="serif" style="margin-bottom:3rem">Account Overview</h2>
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap:4rem">
            <div style="border-right:1px solid var(--border); padding-right:2rem">
                <div style="margin-bottom:2rem; cursor:pointer; font-weight:600">Personal Details</div>
                <div style="margin-bottom:2rem; cursor:pointer; color:var(--text-muted)">Orders</div>
                <div style="margin-bottom:2rem; cursor:pointer; color:var(--text-muted)">Wishlist</div>
                <div style="margin-bottom:2rem; cursor:pointer; color:var(--text-muted)">Settings</div>
            </div>
            <div>
                <h3 class="serif" style="margin-bottom:1rem">Welcome back, Henry</h3>
                <p style="color:var(--text-muted)">Your account is currently active. You have 2 pending shipments.</p>
            </div>
        </div>
    </section>

</html>
