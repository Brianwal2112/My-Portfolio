<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | LUMINA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav"><a href="index.html" class="logo">LUMINA<span>.</span></a> <a href="index.html" style="text-decoration:none; color:#000; font-size:0.7rem">BACK TO HOME</a></nav>
    <section class="section" style="max-width:600px; margin:0 auto; padding-top:150px;">
        <h2 class="serif" style="text-align:center; margin-bottom:3rem">Get in Touch</h2>
        <form style="display:grid; gap:1.5rem">
            <input type="text" placeholder="Name" style="padding:1rem; border:1px solid var(--border); font-family:inherit">
            <input type="email" placeholder="Email" style="padding:1rem; border:1px solid var(--border); font-family:inherit">
            <textarea placeholder="Message" rows="5" style="padding:1rem; border:1px solid var(--border); font-family:inherit"></textarea>
            <button class="btn-premium" style="border:none; cursor:pointer">Send Inquiry</button>
        </form>
    </section>
</body>
</html>
