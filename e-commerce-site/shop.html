<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | LUMINA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav" id="mainNav">
        <a href="index.html" class="logo">LUMINA<span>.</span></a>
        <div class="search-container">
            <input type="text" id="productSearch" placeholder="Search collection...">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">Philosophy</a></li>
        </ul>
        <div class="nav-icons">
            <div class="icon-btn" id="accountBtn">ACCOUNT</div>
            <div class="icon-btn" id="cartBtn">BAG <span class="badge">0</span></div>
        </div>
    </nav>

    <section class="section" style="padding-top: 120px;">
        <div class="section-title">
            <span class="label">The Catalog</span>
            <h2 id="categoryTitle">All Collections</h2>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="apparel">Apparel</button>
            <button class="filter-btn" data-category="accessories">Accessories</button>
            <button class="filter-btn" data-category="jewelry">Jewelry</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </section>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span id="closeModal" class="close-modal">&times;</span>
            <div class="modal-grid">
                <div class="modal-visual"><img src="" id="modalImage" alt="Product"></div>
                <div class="modal-info">
                    <span class="label" id="modalCategory">Category</span>
                    <h2 id="modalName">Product</h2>
                    <p id="modalPrice" class="product-price">$0</p>
                    <p id="modalDesc" class="description"></p>
                    <button id="modalAddBtn" class="btn-premium" style="width:100%; border:none; cursor:pointer;">Add to Bag</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3 class="serif">Your Bag</h3>
            <span id="closeCart" style="cursor:pointer">CLOSE</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="total-row"><span>Total</span><span id="cartTotal">$0</span></div>
            <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
