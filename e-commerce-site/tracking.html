<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | LUMINA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav"><a href="index.html" class="logo">LUMINA<span>.</span></a> <a href="index.html" style="text-decoration:none; color:#000; font-size:0.7rem">BACK TO HOME</a></nav>
    <section class="section" style="max-width:800px; margin:0 auto; padding-top:150px;">
        <h2 class="serif" style="text-align:center; margin-bottom:4rem">Track Your Order</h2>
        <div style="display:flex; gap:1rem; margin-bottom:5rem">
            <input type="text" placeholder="Order Number (e.g. LUM-12345)" style="flex:1; padding:1rem; border:1px solid var(--border); font-family:inherit">
            <button class="btn-premium" style="border:none; cursor:pointer">Track</button>
        </div>
        <div style="border:1px solid var(--border); padding:2rem; text-align:center; color:var(--text-muted)">
            Enter your order ID to see real-time shipping updates.
        </div>
    </section>
</body>
</html>
